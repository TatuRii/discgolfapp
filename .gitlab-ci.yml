image: node:20

stages:
  - quality

cache:
  paths:
    - node_modules/

before_script:
  - corepack enable
  - yarn install --immutable

lint:
  stage: quality
  script:
    - yarn lint

typecheck:
  stage: quality
  script:
    - npx tsc --noEmit

test:
  stage: quality
  script:
    - yarn test --passWithNoTests
